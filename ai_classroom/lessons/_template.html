<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}｜AI 小學堂</title>
    <meta name="description" content="{{summary}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{summary}}">
    <meta property="og:type" content="article">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        html { scroll-behavior: smooth; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 20px; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif; }

        .hero-bg { background: linear-gradient(135deg, #0f2460 0%, #1e3a8a 50%, #1e40af 100%); }
        .hero-lesson  { background: linear-gradient(135deg, #0f2460 0%, #1e3a8a 55%, #2563eb 100%); }
        .hero-howto   { background: linear-gradient(135deg, #0f2460 0%, #115e59 55%, #0d9488 100%); }

        .card { box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04); }

        /* ===== 內文排版：Typography 打底，以下是本站客製 ===== */
        .lesson-body { line-height: 1.9; }
        .lesson-body :where(p, li) { letter-spacing: 0.01em; }

        /* 大節標題：左側色條 */
        .lesson-body h2 {
            position: relative;
            padding-left: 0.85rem;
            margin-top: 3rem;
            font-size: 1.4rem;
            scroll-margin-top: 4.5rem;
        }
        .lesson-body h2::before {
            content: "";
            position: absolute; left: 0; top: 0.15em; bottom: 0.15em;
            width: 4px; border-radius: 999px;
            background: var(--accent, #2563eb);
        }
        .lesson-body h3 { margin-top: 2rem; font-size: 1.1rem; color: #334155; scroll-margin-top: 4.5rem; }

        /* 一般引言 */
        .lesson-body blockquote {
            font-style: normal;
            border-left: 3px solid #cbd5e1;
            background: #f8fafc;
            border-radius: 0 0.75rem 0.75rem 0;
            padding: 0.85rem 1.1rem;
            color: #475569;
        }
        .lesson-body blockquote p:first-child { margin-top: 0; }
        .lesson-body blockquote p:last-child  { margin-bottom: 0; }

        /* ===== Callout：來自 .md 的 > [!類型] 標題 ===== */
        .callout {
            border-radius: 1rem;
            padding: 1.1rem 1.25rem;
            margin: 1.75rem 0;
            border: 1px solid transparent;
        }
        .callout-title {
            display: flex; align-items: center; gap: 0.5rem;
            font-weight: 700; font-size: 0.9rem;
            letter-spacing: 0.03em;
            margin-bottom: 0.5rem;
        }
        .callout-title svg { width: 1.05rem; height: 1.05rem; flex-shrink: 0; }
        .callout > p:last-child { margin-bottom: 0; }
        .callout > p { margin: 0.4rem 0; font-size: 0.97rem; }

        .callout-先備  { background: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; }
        .callout-先備 .callout-title { color: #1d4ed8; }
        .callout-比喻  { background: #fff7ed; border-color: #fed7aa; color: #7c2d12; }
        .callout-比喻 .callout-title { color: #ea580c; }
        .callout-重點  { background: #eef2ff; border-color: #c7d2fe; color: #312e81; }
        .callout-重點 .callout-title { color: #4f46e5; }
        .callout-提醒  { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
        .callout-提醒 .callout-title { color: #dc2626; }
        .callout-總結  { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
        .callout-總結 .callout-title { color: #16a34a; }
        .callout-金融業  { background: linear-gradient(to right, #eff6ff, #f8faff); border-color: #bfdbfe; color: #1e3a8a; }
        .callout-金融業 .callout-title { color: #1d4ed8; }

        /* ===== 段落分級：口白＝現場唸的，延伸＝只在網頁 ===== */
        .seg-extra > h2::after {
            content: "延伸";
            margin-left: 0.6rem;
            padding: 0.15rem 0.45rem;
            border: 1px solid #e2e8f0; border-radius: 999px;
            font-size: 0.6rem; font-weight: 600; color: #94a3b8;
            vertical-align: middle;
        }

        /* ===== 表格：卡片化 ===== */
        .lesson-body table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.9rem;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            margin: 1.75rem 0;
        }
        .lesson-body thead { background: #f1f5f9; }
        .lesson-body th {
            text-align: left; font-weight: 600; color: #334155;
            padding: 0.7rem 0.9rem; border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        .lesson-body td { padding: 0.7rem 0.9rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        .lesson-body tbody tr:last-child td { border-bottom: none; }
        .lesson-body tbody tr:hover { background: #f8fafc; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* ===== 程式碼／示意框 ===== */
        .lesson-body pre {
            background: #0f172a; color: #e2e8f0;
            border-radius: 0.9rem; padding: 1rem 1.15rem;
            font-size: 0.87rem; line-height: 1.7;
            overflow-x: auto;
        }
        .lesson-body :not(pre) > code {
            background: #f1f5f9; color: #be123c;
            padding: 0.12em 0.4em; border-radius: 0.35rem;
            font-size: 0.88em; font-weight: 500;
        }
        .lesson-body pre code { background: none; color: inherit; padding: 0; font-weight: 400; }

        /* ===== 實作課：有序清單變步驟卡 ===== */
        .howto .lesson-body > ol { list-style: none; padding-left: 0; counter-reset: step; }
        .howto .lesson-body > ol > li {
            counter-increment: step;
            position: relative;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.1rem 1.25rem 1.1rem 3.4rem;
            margin: 0.85rem 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .howto .lesson-body > ol > li::before {
            content: counter(step);
            position: absolute; left: 1rem; top: 1.05rem;
            width: 1.75rem; height: 1.75rem;
            border-radius: 999px;
            background: #0d9488; color: #fff;
            font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .howto .lesson-body > ol > li > p:first-child { margin-top: 0; }
        .howto .lesson-body > ol > li > p:last-child  { margin-bottom: 0; }

        /* 截圖 */
        .lesson-body img {
            border-radius: 0.9rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin: 1.5rem auto;
        }

        /* 目錄 */
        .toc-link {
            display: block; padding: 0.4rem 0.7rem;
            font-size: 0.83rem; color: #64748b;
            border-radius: 0.6rem; border-left: 2px solid transparent;
            transition: all 0.15s;
        }
        .toc-link:hover { background: #f8fafc; color: #1d4ed8; }
        .toc-link.active { color: #1d4ed8; border-left-color: #2563eb; background: #eff6ff; font-weight: 500; }
        /* ==螢光筆==：只染下半截，像真的用螢光筆畫過 */
        mark.hl {
            background: linear-gradient(transparent 52%, #fde68a 52%);
            color: inherit; padding: 0 .12em; border-radius: .1em;
        }

        /* ===== ```flow 流程：誰做了什麼，靠 CSS 對齊不靠空格 ===== */
        .fl { margin: 1.2rem 0; }
        .fl-step { position: relative; display: grid; gap: .1rem 1rem; padding: 0 0 1.15rem 1.6rem; }
        @media (min-width: 640px) { .fl-step { grid-template-columns: 8rem 1fr; align-items: baseline; } }
        .fl-step:last-child { padding-bottom: 0; }
        .fl-step::before {
            content: ""; position: absolute; left: .28rem; top: .5rem;
            width: .55rem; height: .55rem; border-radius: 999px;
            background: #fff; border: 2px solid var(--accent);
        }
        .fl-step:not(:last-child)::after {
            content: ""; position: absolute; left: .5rem; top: 1.2rem; bottom: .1rem;
            width: 2px; background: #e2e8f0;
        }
        .fl-who {
            font-size: .7rem; font-weight: 700; letter-spacing: .06em;
            color: var(--accent);
        }
        .fl-what {
            font-size: .9rem; color: #334155; line-height: 1.75;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* 內文裡的 [[ ]] */
        .term-link {
            color: var(--accent); text-decoration: none;
            border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        }
        .term-link:hover { border-bottom-color: var(--accent); }
    </style>

</head>

    </footer>

    <script>

        // 表格加水平捲動外框，手機才不會撐破版面
        document.querySelectorAll('.lesson-body table').forEach(t => {
            const wrap = document.createElement('div');
            wrap.className = 'table-wrap';
            t.parentNode.insertBefore(wrap, t);
            wrap.appendChild(t);
        });

        // 目錄高亮
        const links = [...document.querySelectorAll('.toc-link')];
        const heads = links.map(a => document.getElementById(a.hash.slice(1))).filter(Boolean);
        if (heads.length) {
            const onScroll = () => {
                let idx = 0;
                heads.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) idx = i; });
                links.forEach((a, i) => a.classList.toggle('active', i === idx));
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }
    </script>
